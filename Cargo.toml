[package]
name = "ai"
version = "1.0.0-alpha.3"
edition = "2021"
license = "MIT"

[dev-dependencies]
mockito = "1"
serial_test = "3"
tempfile = "3"

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
arboard = "3"
