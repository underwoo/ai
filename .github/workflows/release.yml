name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: ai-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: ai-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: ai-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/${{ matrix.target }}/release/ai ${{ matrix.asset_name }}
          gh release upload ${{ github.event.release.tag_name }} ${{ matrix.asset_name }}
